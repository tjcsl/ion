<!DOCTYPE html>
<html>
    <head>
        <style>
            @page {
                size: letter;
                margin: 0;
                @frame footer_frame {
                    -pdf-frame-content: footer_content;
                    bottom: 15px;
                    right: 15px;
                    width: 300px;
                    height: 20px;
                }
            }
            body {
                font-family: "Open Sans", "Helvetica Neue", sans-serif;
            }
            #footer_content {
                text-align: right;
                font-size: 8pt;
                color: gray;
            }
        </style>
    </head>
    <body>
        <div id="footer_content">
            Ion Printing | {{ obj.user.username }} | {{ time|date:"Y-m-d H:i" }}
        </div>
    </body>
</html>
